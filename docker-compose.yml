# PostgreSQL for the Megu bot + dashboard.
# Start it with:   docker compose up -d
# Stop it with:    docker compose down   (add -v to also wipe the data)
services:
  db:
    image: postgres:16-alpine
    container_name: megu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: megu
      POSTGRES_PASSWORD: megu_dev_password
      POSTGRES_DB: megu
    ports:
      - "5432:5432" # host:container — connect from your apps at localhost:5432
    volumes:
      - megu-pgdata:/var/lib/postgresql/data # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megu -d megu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: a lightweight web UI to browse the database at http://localhost:8080
  # Log in with System: PostgreSQL, Server: db, User: megu, Password: megu_dev_password, Database: megu
  adminer:
    image: adminer:latest
    container_name: megu-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  megu-pgdata:
